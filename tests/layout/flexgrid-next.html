<!doctype html><html><head><meta charset="utf-8"><title>Flex Grid precision next</title></head><body style="margin:0">
<section id="case0"><div style="display:grid;width:100px;grid-template-columns:50px 50px;grid-template-rows:100px;align-items:baseline"><div id="case0-a" style="height:50%"></div><div id="case0-b" style="height:30px"></div></div></section>
<section id="case1"><div id="case1-g" style="display:flex;width:max-content;column-gap:10%"><div style="width:50px;height:10px"></div><div id="case1-b" style="width:50px;height:10px"></div></div></section>
<section id="case2"><div style="display:flex;width:70px"><div id="case2-a" style="writing-mode:vertical-rl;height:100px;line-height:0"><span style="display:inline-block;width:50px;height:100px"></span><span style="display:inline-block;width:50px;height:100px"></span></div></div></section>
<section id="case3"><div style="display:grid;width:100px;grid-template-columns:50px 50px;grid-template-rows:100px;align-items:last baseline"><div id="case3-a" style="height:50%"></div><div id="case3-b" style="height:30px"></div></div></section>
<section id="case4"><div style="display:flex;width:100px;column-gap:10%"><div id="case4-a" style="width:50px;height:10px;min-width:0"></div><div id="case4-b" style="width:50px;height:10px;min-width:0"></div></div></section>
<section id="case5"><div style="display:grid;width:70px;grid-template-columns:1fr"><div id="case5-a" style="writing-mode:vertical-lr;height:120px;box-sizing:border-box;padding:10px;line-height:0"><span style="display:inline-block;width:50px;height:100px"></span><span style="display:inline-block;width:50px;height:100px"></span></div></div></section>
<section><div id="mixed" style="display:grid;width:max-content;grid-template-columns:20px auto auto"><div style="grid-column:1 / span 2;grid-row:1;width:100px;height:10px"></div><div style="grid-column:2 / span 2;grid-row:2;width:100px;height:10px"></div><div id="mixed-a" style="grid-column:2;grid-row:3"></div><div id="mixed-b" style="grid-column:3;grid-row:3"></div></div></section>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{font-family:sans-serif;font-size:16px;margin:8px}</style></head>
<body>
<!-- Regressão: float:left;margin-left:-40px DENTRO de um display:inline-block.
     O inline-block estabelece um BFC → o float é CONTIDO nele e NÃO deve vazar
     para o <p> ancestral (onde 3 deles acumulariam -10px cada = cascata diagonal,
     o bug dos "Projetos-irmãos" da wikipedia). Esperado: o <p> permanece contexto
     INLINE (os inline-blocks fluem como átomos), não vira bloco com floats içados. -->
<p>
<span style="display:inline-block;width:15em;padding-left:40px;">
  <span style="float:left;width:30px;margin-left:-40px;">IC</span><b>Commons</b></span>
<span style="display:inline-block;width:15em;padding-left:40px;">
  <span style="float:left;width:30px;margin-left:-40px;">IC</span><b>Incubator</b></span>
</p>
</body></html>

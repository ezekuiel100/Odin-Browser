<!doctype html>
<!-- Padrão MDN reference-layout: grid de 5 trilhas com GUTTERS, e itens
     colocados em col 1/3/5 via grid-template-areas com células nulas '.'.
     Itens fora de ordem no fonte (side, toc, main). Esperado:
       side -> col1 (200px @x=0)
       main -> col3 (1fr  @x=220, largura grande)
       toc  -> col5 (200px @x=..., à direita)
     Se as áreas com '.' não resolverem, os itens auto-placeiam e a 'toc'
     cai numa gutter de 20px (o "In this article" vertical do MDN). -->
<html><head><style>
  body { margin: 0; font-family: sans-serif; }
  .layout {
    display: grid;
    grid-template-columns: 200px 20px 1fr 20px 200px;
    grid-template-areas: "side . main . toc";
    width: 1000px;
  }
  .side { grid-area: side; }
  .main { grid-area: main; }
  .toc  { grid-area: toc; }
  .cell { padding: 8px; }
</style></head><body>
  <div class="layout">
    <div class="side cell">esquerda</div>
    <div class="toc cell">In this article</div>
    <div class="main cell">conteúdo principal</div>
  </div>
</body></html>

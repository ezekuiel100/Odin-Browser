<!doctype html>
<meta charset="utf-8">
<title>stroke-opacity — a geometria extra nao pode DOBRAR o alfa</title>
<!--
  Geometria fixa, sem texto. Traco TRANSLUCIDO com ponta e junta redondas: a
  ponta e a junta sao desenhadas como geometria EXTRA (o AddPolyline do ImGui so
  faz ponta reta), e se ela se sobrepuser ao proprio traco o trecho comum compoe
  o alfa DUAS vezes -> mancha escura. Com traco OPACO o defeito e invisivel, por
  isso o gate tem de usar alfa < 1.
    y=0    linha translucida com stroke-linecap:round   -> uniforme
    y=60   "L" translucido com stroke-linejoin:round    -> uniforme
    y=140  MESMA linha, opaca (controle)                -> a cor cheia
  A afirmacao e de UNIFORMIDADE (o pixel mais escuro nao e muito mais escuro que
  o tipico), nunca de cor exata: nada aqui depende de fonte nem de driver.
-->
<style>
  body { margin: 0; background: #fff }
  svg { display: block; margin: 0 }
</style>
<svg width="260" height="60">
  <line x1="30" y1="30" x2="230" y2="30" stroke="#000" stroke-width="20"
        stroke-opacity="0.35" stroke-linecap="round"/>
</svg>
<svg width="260" height="80">
  <path d="M40 70 L130 15 L220 70" fill="none" stroke="#000" stroke-width="20"
        stroke-opacity="0.35" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
<svg width="260" height="60">
  <line x1="30" y1="30" x2="230" y2="30" stroke="#000" stroke-width="20"
        stroke-linecap="round"/>
</svg>

<!doctype html>
<html><head><meta charset="utf-8"><title>M234 + esqueleto de imagem que falha</title>
<style>
  body { margin: 0; background: #fff; }
  .cb   { position: relative; width: 180px; height: 120px; }
  /* ⚠️ B/C/D usam img de BLOCO, nao absoluta: com o <img> como filho UNICO e
     absoluto o pai vira caixa inline, o item nao e icado e a regiao fica vazia —
     a 1a versao deste gate passava por esse motivo errado, nao pelo conserto. */
  .foto { display: block; width: 180px; height: 120px; }
</style></head>
<body>
  <!-- A: abspos com height:100% tem de pintar a ALTURA INTEIRA (M234).
       Metade da largura de proposito: a direita fica com o cinza do pai e serve
       de controle de que o pai pinta e de que a LARGURA nao vazou. -->
  <div class="cb" style="background:#e0e0e0">
    <div style="position:absolute; top:0; left:0; width:50%; height:100%; background:#00a000"></div>
  </div>

  <!-- B: imagem DECORATIVA (alt="") que falha, sobre laranja. Pelo HTML o
       elemento nao representa nada: o laranja tem de aparecer inteiro. -->
  <div class="cb" style="background:#ff6600; margin-top:10px">
    <img class="foto" src="sem-decoder-para-isto.avif" alt="">
  </div>

  <!-- C: CONTROLE de que imagem ainda PINTA. Sem ele, ter apagado o desenho de
       imagem por inteiro passaria no caso B. -->
  <div class="cb" style="background:#ff6600; margin-top:10px">
    <img class="foto" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAEElEQVR4nGNgYDiDhIjiAAA/AwzBZVJXTQAAAABJRU5ErkJggg==">
  </div>

  <!-- D: CONTROLE DO RECORTE. Mesma falha do caso B, mas com alt de CONTEUDO:
       aqui o esqueleto cinza FICA. E o que separa "nao inventar" de "apagar
       imagem quebrada", e foi medido (theguardian tem 104 de 106 <img> assim). -->
  <div class="cb" style="background:#ff6600; margin-top:10px">
    <img class="foto" src="sem-decoder-para-isto.avif" alt="foto da materia">
  </div>
</body></html>

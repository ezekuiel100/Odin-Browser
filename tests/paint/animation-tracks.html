<!doctype html><style>
html,body{margin:0;background:white}
.box{position:absolute;width:40px;height:40px;background:#00cc00;animation-duration:2s;animation-delay:-1s;animation-timing-function:linear;animation-play-state:paused;animation-fill-mode:both}
#px{left:10px;top:10px;animation-name:px}
@keyframes px{from{transform:translateX(0)}to{transform:translateX(100px)}}
#mixed{left:10px;top:70px;animation-name:mixed}
@keyframes mixed{from{transform:translateX(20px)}to{transform:translateX(100%)}}
#base{left:10px;top:130px;transform:translateX(80px);animation-name:base}
@keyframes base{to{transform:none}}
#sparse{left:150px;top:10px;opacity:0;animation-name:sparse}
@keyframes sparse{from{opacity:0}25%{background:#00cc00}to{opacity:1}}
#single{left:150px;top:70px;animation-name:single;animation-delay:-0.5s}
@keyframes single{50%{transform:translateX(80px)}}
#list{left:150px;top:130px;animation:move 2s linear -1s paused both,reset 2s linear -1s paused both}
@keyframes move{from{transform:translateX(100px)}to{transform:translateX(200px)}}
@keyframes reset{from{transform:none}to{transform:none}}
#parent{left:10px;top:200px;background:transparent;animation-name:px}
#child{width:20px;height:20px;background:#0000ff}
#outside{left:-100px;top:260px;animation-name:outside}
@keyframes outside{from{transform:translateX(0)}to{transform:translateX(300px)}}
</style>
<div id="px" class="box"></div><div id="mixed" class="box"></div>
<div id="base" class="box"></div><div id="sparse" class="box"></div>
<div id="single" class="box"></div><div id="list" class="box"></div>
<div id="parent" class="box"><div id="child"></div></div><div id="outside" class="box"></div>

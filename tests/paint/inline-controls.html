<!doctype html><style>
body{margin:0;background:white;font:20px/1.4 Arial}
.sample{position:absolute;left:10px;top:10px;width:300px;height:50px}
.icon{display:inline-block;position:relative;width:30px;height:30px}
.icon::before{content:"";position:absolute;left:2px;top:2px;width:14px;height:18px;background:blue}
.icon::after{content:"";position:absolute;left:8px;top:8px;width:14px;height:18px;background:lime}
.flat::before{content:"";position:absolute;left:0;top:0;width:30px;height:30px;background:lime}
.hidden{visibility:hidden}
.hidden::after{content:"";position:absolute;left:0;top:0;width:40px;height:30px;background:purple}
</style><body>
<div class="sample">Normal <span>text</span></div>
<div class="sample" style="top:70px;font-style:italic;font-weight:bold"><span style="font-style:normal;font-weight:normal">Normal <span>text</span></span></div>
<div style="position:absolute;left:10px;top:150px"><span class="icon"></span></div>
<div style="position:absolute;left:100px;top:150px"><span class="hidden">hidden</span></div>
<div style="position:absolute;left:200px;top:150px"><span style="opacity:0"><span class="icon"></span></span></div>
<div style="position:absolute;left:300px;top:150px;visibility:hidden"><span class="icon"></span></div>
<div style="position:absolute;left:400px;top:150px"><span class="flat"></span></div>
</body>

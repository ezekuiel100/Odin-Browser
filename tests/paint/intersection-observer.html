<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>paint gate: IntersectionObserver (M232)</title>
<style>
  /* Geometria por posicao ABSOLUTA e cores chapadas: nada aqui depende de
     fonte, de metrica de texto ou de antialiasing. Viewport do gate: 400x300. */
  html, body { margin: 0; padding: 0; background: #fff; }
  .cx { position: absolute; width: 160px; height: 80px; }

  /* ALVO: nasce VERMELHO e so o callback do observador o deixa VERDE. */
  #alvo    { left: 20px;  top: 20px;  background: #b00020; }
  #alvo.on { background: #0a7d32; }

  /* INDICADOR: fica AZUL. Vira AMARELO se o alvo de fora da tela disparar --
     ou seja, o gate falha tanto por nao disparar quanto por disparar demais. */
  #ind     { left: 200px; top: 20px;  background: #1030c0; }
  #ind.on  { background: #f0d000; }

  /* CONTROLE: verde ESTATICO, sem JS nenhum. Se este cair, o problema nao e o
     observador -- e CSS/pintura, e as duas afirmacoes de cima nada valem. */
  #ctl     { left: 20px;  top: 120px; background: #0a7d32; }

  /* Alvo la embaixo, fora de qualquer viewport de 300px de altura. */
  #longe   { left: 20px;  top: 2000px; background: #b00020; }
</style>
</head>
<body>
  <div id="alvo" class="cx"></div>
  <div id="ind"  class="cx"></div>
  <div id="ctl"  class="cx"></div>
  <div id="longe" class="cx"></div>
  <script>
    var io = new IntersectionObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        var e = entries[i];
        if (!e.isIntersecting) continue;               // a entry inicial do #longe cai aqui
        if (e.target.id === 'alvo')  e.target.classList.add('on');
        if (e.target.id === 'longe') document.getElementById('ind').classList.add('on');
      }
    });
    io.observe(document.getElementById('alvo'));
    io.observe(document.getElementById('longe'));
  </script>
</body>
</html>

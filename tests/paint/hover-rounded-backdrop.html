<!doctype html>
<style>
body { margin:0; background:#17172c }
.stage { position:relative; isolation:isolate; width:400px; height:450px; padding:80px; box-sizing:border-box }
.backdrop { position:absolute; top:0; left:0; width:400px; height:450px; background:#205020 }
.stripe { position:absolute; top:0; left:160px; width:240px; height:450px; background:#203050 }
.card { position:relative; z-index:1; box-sizing:border-box; width:160px; height:220px; border:4px solid #ff8000; border-radius:24px; overflow:hidden; background:rgba(255,255,255,0.05) }
.card:hover { transform:scale(1.08); box-shadow:0 0 24px 4px #ff800080 }
.photo { width:100%; height:100%; background:#e04040 }
</style>
<div class="stage"><div class="backdrop"></div><div class="stripe"></div><div class="card"><div class="photo"></div></div></div>

<!doctype html>
<style>
body { margin:0; background:#00ff00 }
.band { position:absolute; left:0; top:0; width:640px; height:180px; background:#ff0000 }
.blue { position:absolute; left:160px; top:0; width:80px; height:180px; background:#0000ff }
.outside { position:absolute; left:400px; top:0; width:240px; height:180px; background:#0000ff }
.frost { position:absolute; left:80px; top:40px; width:160px; height:100px; border-radius:24px; backdrop-filter:blur(16px) }
.halo { position:absolute; left:300px; top:40px; width:100px; height:100px; backdrop-filter:blur(16px) }
.stripes { position:absolute; left:0; top:200px; width:256px; height:128px; background:repeating-linear-gradient(90deg,#000 0px,#000 2px,#fff 2px,#fff 4px) }
.average { position:absolute; left:32px; top:216px; width:192px; height:96px; border-radius:12px; backdrop-filter:blur(16px) }
.prefix-stripes { position:absolute; left:300px; top:200px; width:256px; height:128px; background:repeating-linear-gradient(90deg,#404040 0px,#404040 2px,#c0c0c0 2px,#c0c0c0 4px) }
.prefix { position:absolute; left:332px; top:216px; width:192px; height:96px; backdrop-filter:brightness(2) blur(8px) }
.gray { position:absolute; left:440px; top:40px; width:100px; height:100px; backdrop-filter:grayscale(1) }
.hidden-frost { position:absolute; left:0; top:0; width:640px; height:180px; opacity:0; transition:opacity .3s; backdrop-filter:blur(20px) }
.group { position:absolute; left:20px; top:360px; width:120px; height:120px; opacity:.5 }
.round { width:120px; height:120px; border-radius:40px; overflow:hidden; background:#ff0000 }
.nested { margin:20px; width:80px; height:80px; border-radius:40px; overflow:hidden; background:#0000ff }
</style>
<div style="height:900px"></div>
<div class="band"></div><div class="blue"></div><div class="outside"></div>
<div class="frost"></div><div class="halo"></div><div class="gray"></div>
<div class="hidden-frost"></div>
<div class="stripes"></div><div class="average"></div>
<div class="prefix-stripes"></div><div class="prefix"></div>
<div class="group"><div class="round"><div class="nested"></div></div></div>

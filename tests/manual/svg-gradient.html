<!doctype html>
<meta charset="utf-8">
<title>stop-color / stop-opacity (M225)</title>
<style>
  body { margin: 0; background: #fff; font: 14px sans-serif }
  .row { display: flex; gap: 0; align-items: flex-start }
  /* 5. os dois stops vindos de REGRA CSS, nao de atributo */
  #viaCss stop:first-child { stop-color: #ff0000 }
  #viaCss stop:last-child  { stop-color: #0000ff }
</style>

<div class="row">
  <!-- 1. linear horizontal (default x1=0 -> x2=1, objectBoundingBox) -->
  <svg width="120" height="120" viewBox="0 0 100 100">
    <defs><linearGradient id="g1">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient></defs>
    <rect x="0" y="0" width="100" height="100" fill="url(#g1)"/>
  </svg>

  <!-- 2. linear VERTICAL (x2=0,y2=1) com 3 stops -->
  <svg width="120" height="120" viewBox="0 0 100 100">
    <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#ffff00"/>
      <stop offset="1"   stop-color="#008000"/>
    </linearGradient></defs>
    <rect x="0" y="0" width="100" height="100" fill="url(#g2)"/>
  </svg>

  <!-- 3. radial -->
  <svg width="120" height="120" viewBox="0 0 100 100">
    <defs><radialGradient id="g3">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#0040c0"/>
    </radialGradient></defs>
    <circle cx="50" cy="50" r="50" fill="url(#g3)"/>
  </svg>

  <!-- 4. stop-opacity: o lado direito desaparece sobre o fundo -->
  <svg width="120" height="120" viewBox="0 0 100 100">
    <defs><linearGradient id="g4">
      <stop offset="0" stop-color="#c00000" stop-opacity="1"/>
      <stop offset="1" stop-color="#c00000" stop-opacity="0"/>
    </linearGradient></defs>
    <rect x="0" y="0" width="100" height="100" fill="url(#g4)"/>
  </svg>

  <!-- 5. stop-color vindo de REGRA CSS (o que da nome ao marco) -->
  <svg width="120" height="120" viewBox="0 0 100 100">
    <defs><linearGradient id="viaCss">
      <stop offset="0"/>
      <stop offset="1"/>
    </linearGradient></defs>
    <rect x="0" y="0" width="100" height="100" fill="url(#viaCss)"/>
  </svg>

  <!-- 6. userSpaceOnUse + href herdando os stops de outro gradiente -->
  <svg width="120" height="120" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="src"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#00c000"/></linearGradient>
      <linearGradient id="g6" xlink:href="#src" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"/>
    </defs>
    <rect x="0" y="0" width="100" height="100" fill="url(#g6)"/>
  </svg>

  <!-- 7. CONTROLE: referencia quebrada -> cai na cor solida herdada (nao some) -->
  <svg width="120" height="120" viewBox="0 0 100 100" fill="#808080">
    <rect x="0" y="0" width="100" height="100" fill="url(#naoExiste)"/>
  </svg>
</div>

<p>1 vermelho→azul · 2 vertical 3 cores · 3 radial · 4 esmaece à direita ·
   5 stops só por CSS · 6 diagonal via href+userSpaceOnUse · 7 controle: cinza sólido</p>

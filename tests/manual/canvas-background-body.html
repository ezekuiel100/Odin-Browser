<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fundo do canvas vindo do body (raiz sem fundo) + gradiente</title>
<style>
  /* <html> SEM fundo -> quem propaga p/ o canvas e o <body>. E um GRADIENTE:
     tem de cobrir a pagina inteira, nao so a faixa do body. */
  body { margin:0; padding:24px; font:14px sans-serif; color:#fff;
         background: linear-gradient(160deg, #1e3a8a, #7e22ce) }
  .cartao { background:#fff; color:#111; padding:12px; width:320px; border-radius:6px }
</style>
</head>
<body>
  <div class="cartao">
    Conteudo curto. O gradiente do &lt;body&gt; tem de cobrir todo o viewport.
  </div>
</body>
</html>

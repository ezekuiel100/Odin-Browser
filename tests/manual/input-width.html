<!doctype html>
<meta charset="utf-8">
<title>largura de input</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  .cb { width: 400px; background: #eef2ff; padding: 8px; margin-bottom: 10px; }
  input { background: #f8fafc; border: 1px solid #94a3b8; padding: 6px 10px; font-size: 14px; }
  .rot { font-size: 12px; color: #475569; }
</style>

<div class="rot">A: input width:100% (deve encher os 400)</div>
<div class="cb"><input style="width:100%" placeholder="A cem por cento"></div>

<div class="rot">B: input width:300px (controle)</div>
<div class="cb"><input style="width:300px" placeholder="B trezentos px"></div>

<div class="rot">C: input sem width (default do UA)</div>
<div class="cb"><input placeholder="C default"></div>

<div class="rot">D: DIV com width:100% (nao-controle, referencia)</div>
<div class="cb"><div style="width:100%;height:28px;background:#c7d2fe"></div></div>

<div class="rot">E: input width:100% dentro de pai RELATIVE (como o tradebig)</div>
<div class="cb"><div style="position:relative;width:100%"><input style="width:100%" placeholder="E relative"></div></div>

<div class="rot">F: textarea width:100% (o outro controle)</div>
<div class="cb"><textarea style="width:100%;height:40px"></textarea></div>

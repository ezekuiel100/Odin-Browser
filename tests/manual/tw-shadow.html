<!DOCTYPE html>
<html>
<head>
<style>
  /* Reproduz o sistema de sombra do Tailwind v4 (o que tradebig.com.br usa). */
  *, ::before, ::after {
    --tw-shadow: 0 0 #0000;
    --tw-shadow-color: initial;
    --tw-inset-shadow: 0 0 #0000;
    --tw-inset-ring-shadow: 0 0 #0000;
    --tw-ring-offset-shadow: 0 0 #0000;
    --tw-ring-shadow: 0 0 #0000;
  }
  body { background: #f8fafc; font-family: sans-serif; padding: 40px; }
  h1 { font-size: 18px; color: #334155; }
  .grid { display: flex; gap: 28px; flex-wrap: wrap; }

  /* utilitários de sombra do Tailwind (valores reais do build) */
  .shadow-sm  { --tw-shadow: 0 1px 3px 0 var(--tw-shadow-color, #0000001a), 0 1px 2px -1px var(--tw-shadow-color, #0000001a); }
  .shadow-md  { --tw-shadow: 0 4px 6px -1px var(--tw-shadow-color, #0000001a), 0 2px 4px -2px var(--tw-shadow-color, #0000001a); }
  .shadow-lg  { --tw-shadow: 0 10px 15px -3px var(--tw-shadow-color, #0000001a), 0 4px 6px -4px var(--tw-shadow-color, #0000001a); }
  .shadow-xl  { --tw-shadow: 0 20px 25px -5px var(--tw-shadow-color, #0000001a), 0 8px 10px -6px var(--tw-shadow-color, #0000001a); }
  .shadow-2xl { --tw-shadow: 0 25px 50px -12px var(--tw-shadow-color, #00000040); }

  /* toda caixa .shadow-* compõe a cadeia, IGUAL ao Tailwind */
  [class*="shadow-"] {
    box-shadow: var(--tw-inset-shadow), var(--tw-inset-ring-shadow), var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow);
  }

  .card {
    width: 200px; height: 120px; background: #fff; border-radius: 12px;
    padding: 16px; box-sizing: border-box; color: #0f172a;
  }
  .card b { font-size: 20px; }
  .card small { color: #64748b; }
</style>
</head>
<body>
  <h1>Tailwind v4 box-shadow chain (var + initial fallback)</h1>
  <div class="grid">
    <div class="card shadow-sm"><b>sm</b><br><small>0 1px 3px</small></div>
    <div class="card shadow-md"><b>md</b><br><small>0 4px 6px</small></div>
    <div class="card shadow-lg"><b>lg</b><br><small>0 10px 15px</small></div>
    <div class="card shadow-xl"><b>xl</b><br><small>0 20px 25px</small></div>
    <div class="card shadow-2xl"><b>2xl</b><br><small>0 25px 50px</small></div>
  </div>
  <p style="color:#94a3b8;font-size:13px">Esperado: cada card com sombra progressivamente mais forte. Antes do fix: todos chapados.</p>
</body>
</html>

<!DOCTYPE html>
<!-- GABARITO: anel vermelho de 5px em volta de (20,20)-(70,70), feito com um
     quadrado vermelho 60x60 em (15,15) e um branco 50x50 centrado. -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  .outer { position: relative; width: 60px; height: 60px; margin: 15px; background: red; }
  .inner { position: absolute; top: 5px; left: 5px; width: 50px; height: 50px; background: white; }
</style>
</head>
<body>
  <div class="outer"><div class="inner"></div></div>
</body>
</html>

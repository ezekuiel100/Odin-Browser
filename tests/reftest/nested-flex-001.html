<!DOCTYPE html>
<!-- TESTE: flex aninhado. Coluna externa com 2 linhas flex, cada uma com 2
     celulas 50x50 => grade 2x2 que preenche 100x100 verde solido. -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  .outer { display: flex; flex-direction: column; width: 100px; }
  .row { display: flex; flex-direction: row; }
  .cell { width: 50px; height: 50px; background: green; }
</style>
<link rel="match" href="nested-flex-001-ref.html">
</head>
<body>
  <div class="outer">
    <div class="row"><div class="cell"></div><div class="cell"></div></div>
    <div class="row"><div class="cell"></div><div class="cell"></div></div>
  </div>
</body>
</html>

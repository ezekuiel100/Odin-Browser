<!DOCTYPE html>
<!-- GABARITO: anel vermelho 100x100 com verde 50x50 no centro, via absolute. -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  .outer { position: relative; width: 100px; height: 100px; background: red; }
  .inner { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: green; }
</style>
</head>
<body>
  <div class="outer"><div class="inner"></div></div>
</body>
</html>

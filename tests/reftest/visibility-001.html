<!DOCTYPE html>
<!-- TESTE: visibility:hidden esconde a caixa mas mantém o espaço. Três blocos
     50x50 em coluna (vermelho, azul-oculto, verde). O do meio não pinta, mas
     ocupa 50px → o verde fica em y=100, não y=50. -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  .b { width: 50px; height: 50px; }
  .r { background: red; }
  .h { background: blue; visibility: hidden; }
  .g { background: green; }
</style>
<link rel="match" href="visibility-001-ref.html">
</head>
<body>
  <div class="b r"></div>
  <div class="b h"></div>
  <div class="b g"></div>
</body>
</html>

<!DOCTYPE html>
<!-- TESTE: box-sizing:border-box faz width/height INCLUIREM o padding.
     Com padding 20, o total deve continuar 100x100 (nao 140x140). -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  .b {
    width: 100px;
    height: 100px;
    padding: 20px;
    box-sizing: border-box;
    background: green;
  }
</style>
<link rel="match" href="box-sizing-border-box-001-ref.html">
</head>
<body><div class="b"></div></body>
</html>

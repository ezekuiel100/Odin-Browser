<!DOCTYPE html>
<!-- GABARITO: dois blocos verdes 80x100 com faixa branca de 20px no meio,
     posicionados por position:absolute (sem flex/gap). -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  .wrap { position: relative; width: 180px; height: 100px; }
  .a { position: absolute; top: 0; left: 0;   width: 80px; height: 100px; background: green; }
  .b { position: absolute; top: 0; left: 100px; width: 80px; height: 100px; background: green; }
</style>
</head>
<body>
  <div class="wrap"><div class="a"></div><div class="b"></div></div>
</body>
</html>

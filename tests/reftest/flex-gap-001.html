<!DOCTYPE html>
<!-- TESTE: column-gap cria espaco entre itens flex. Dois itens de 80 com gap 20
     => item0 em x=0..80, item1 em x=100..180 (faixa branca 80..100). -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  .row { display: flex; column-gap: 20px; width: 180px; height: 100px; }
  .item { width: 80px; height: 100px; background: green; }
</style>
<link rel="match" href="flex-gap-001-ref.html">
</head>
<body>
  <div class="row"><div class="item"></div><div class="item"></div></div>
</body>
</html>

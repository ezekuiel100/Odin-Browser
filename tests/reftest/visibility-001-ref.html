<!DOCTYPE html>
<!-- GABARITO: vermelho em y=0, nada (espaço branco) em y=50, verde em y=100. -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  .b { width: 50px; height: 50px; }
  .r { background: red; }
  .spacer { height: 50px; }
  .g { background: green; }
</style>
</head>
<body>
  <div class="b r"></div>
  <div class="spacer"></div>
  <div class="b g"></div>
</body>
</html>

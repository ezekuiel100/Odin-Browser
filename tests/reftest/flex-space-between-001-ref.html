<!DOCTYPE html>
<!-- GABARITO: dois blocos verdes 50x50 nas pontas, via position:absolute. -->
<html>
<head>
<style>
  body { margin: 0; background: white; }
  .wrap { position: relative; width: 200px; height: 50px; }
  .a { position: absolute; top: 0; left: 0;    width: 50px; height: 50px; background: green; }
  .b { position: absolute; top: 0; left: 150px; width: 50px; height: 50px; background: green; }
</style>
</head>
<body>
  <div class="wrap"><div class="a"></div><div class="b"></div></div>
</body>
</html>

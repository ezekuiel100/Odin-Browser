<!doctype html><html><head><style>
body{margin:20px;font-family:sans-serif;font-size:22px}
.box{display:inline-block;width:40px;height:40px;background:#3b82f6;border-radius:6px}
.sub{vertical-align:sub;color:#e11}
.sup{vertical-align:super;color:#1a1}
.t{vertical-align:top}
.m{vertical-align:middle}
.b{vertical-align:bottom}
</style></head><body>
<p>Base <span class="box"></span> texto na baseline</p>
<p>H<span class="sub">2</span>O e x<span class="sup">2</span> potencia</p>
<p>Top<span class="box t"></span> Mid<span class="box m"></span> Bot<span class="box b"></span></p>
</body></html>

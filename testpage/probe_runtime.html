<!DOCTYPE html>
<html><body><div id="x"></div><script>
function ok(name, cond){ console.log((cond ? 'OK ' : 'NO ') + name); }
function probe(name, fn){ try { ok(name, !!fn()); } catch(e){ console.log('ERR ' + name + ' : ' + (e && e.name ? e.name : e)); } }

// ── globais / número ──
probe('globalThis', function(){ return typeof globalThis === 'object'; });
probe('toFixed', function(){ return (3.14159).toFixed(2) === '3.14'; });
probe('toString-radix', function(){ return (255).toString(16) === 'ff'; });
probe('toPrecision', function(){ return (123.456).toPrecision(4) === '123.5'; });
probe('Number.isInteger', function(){ return Number.isInteger(5) && !Number.isInteger(5.5); });
probe('Number.isFinite', function(){ return Number.isFinite(1) && !Number.isFinite(Infinity); });
probe('Number.MAX_SAFE_INTEGER', function(){ return Number.MAX_SAFE_INTEGER === 9007199254740991; });
probe('Number.parseInt', function(){ return Number.parseInt('42') === 42; });

// ── Date ──
probe('new-Date', function(){ var d = new Date(); return typeof d === 'object'; });
probe('Date-getFullYear', function(){ return new Date().getFullYear() >= 2026; });
probe('Date-toISOString', function(){ return new Date().toISOString().indexOf('T') > 0; });
probe('Date-parse', function(){ return Date.parse('2026-01-01') > 0; });

// ── JSON ──
probe('JSON-indent', function(){ return JSON.stringify({a:1}, null, 2).indexOf('\n') >= 0; });
probe('JSON-reviver', function(){ return JSON.parse('{"a":1}', function(k,v){ return typeof v==='number' ? v*2 : v; }).a === 2; });
probe('JSON-replacer-fn', function(){ return JSON.stringify({a:1}, function(k,v){ return v; }) === '{"a":1}'; });

// ── Promise ──
probe('Promise.finally', function(){ return typeof Promise.resolve().finally === 'function'; });
probe('Promise-allSettled', function(){ return typeof Promise.allSettled === 'function'; });

// ── Array ──
probe('Array.flat', function(){ return [1,[2,[3]]].flat(2).length === 3; });
probe('Array.flatMap', function(){ return [1,2].flatMap(function(x){ return [x,x]; }).length === 4; });
probe('Array.fill', function(){ return [1,2,3].fill(0).join('') === '000'; });
probe('Array.at', function(){ return [1,2,3].at(-1) === 3; });
probe('Array.findLast', function(){ return [1,2,3].findLast(function(x){ return x < 3; }) === 2; });
probe('Array.of', function(){ return Array.of(1,2).length === 2; });
probe('Array.keys-iter', function(){ var s = 0; for (var k of [10,20].keys()) s += k; return s === 1; });
probe('Array.entries-iter', function(){ var r = ''; for (var e of ['a'].entries()) r = e[0] + e[1]; return r === '0a'; });
probe('Array.copyWithin', function(){ return typeof [].copyWithin === 'function'; });

// ── String ──
probe('matchAll', function(){ var n = 0; for (var m of 'a1b2'.matchAll(/\d/g)) n++; return n === 2; });
probe('codePointAt', function(){ return 'a'.codePointAt(0) === 97; });
probe('fromCodePoint', function(){ return String.fromCodePoint(97) === 'a'; });
probe('normalize', function(){ return typeof ''.normalize === 'function'; });
probe('localeCompare', function(){ return 'a'.localeCompare('b') < 0; });

// ── Object ──
probe('Object.fromEntries', function(){ return Object.fromEntries([['a',1]]).a === 1; });
probe('Object.getOwnPropertyDescriptor', function(){ var d = Object.getOwnPropertyDescriptor({a:1}, 'a'); return d && d.value === 1; });
probe('Object.setPrototypeOf', function(){ var o = {}; Object.setPrototypeOf(o, {m:1}); return o.m === 1; });
probe('Object.is', function(){ return Object.is(NaN, NaN); });

// ── URI / codificação ──
probe('encodeURIComponent-real', function(){ return encodeURIComponent('ã&') === '%C3%A3%26'; });
probe('decodeURIComponent-real', function(){ return decodeURIComponent('%C3%A3') === 'ã'; });
probe('encodeURI', function(){ return typeof encodeURI === 'function'; });
probe('atob-btoa', function(){ return btoa('hi') === 'aGk=' && atob('aGk=') === 'hi'; });

// ── timers / diversos ──
probe('setTimeout-extra-args', function(){
    var got = null;
    setTimeout(function(a){ got = a; }, 0, 'X');
    return true; // valor verificado async; aqui só a aridade não explodir
});
probe('Proxy', function(){ return typeof Proxy === 'function'; });
probe('Reflect', function(){ return typeof Reflect === 'object'; });
probe('structuredClone', function(){ return typeof structuredClone === 'function'; });
probe('Symbol.asyncIterator', function(){ return typeof Symbol.asyncIterator === 'symbol' || Symbol.asyncIterator !== undefined; });
probe('Function.toString', function(){ function f(){} return f.toString().indexOf('f') >= 0; });
probe('instanceof-Error-nativo', function(){ try { null.x; } catch(e){ return e instanceof TypeError; } });
probe('err.message-nativo', function(){ try { undefined.x; } catch(e){ return typeof e.message === 'string' && e.message.length > 0; } });
probe('getter-defineProperty', function(){ var o = {}; Object.defineProperty(o, 'x', { get: function(){ return 9; } }); return o.x === 9; });
probe('instanceof-basico', function(){ function F(){} return (new F()) instanceof F; });
probe('isArray-frame', function(){ return Array.isArray([]); });
console.log('FIM_RUNTIME');
</script></body></html>

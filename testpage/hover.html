<!doctype html>
<html><head><style>
body { margin: 24px; font-family: sans-serif; font-size: 20px; }
.btn {
  width: 220px;
  padding: 14px 28px;
  margin-bottom: 16px;
  background: #3b82f6;
  color: #ffffff;
  border-radius: 8px;
  border: 2px solid #3b82f6;
  text-align: center;
}
.btn:hover {
  background: #1e3a8a;
  border-color: #1e3a8a;
}
.ghost {
  width: 220px;
  padding: 14px 28px;
  background: #ffffff;
  color: #3b82f6;
  border: 2px solid #3b82f6;
  border-radius: 8px;
  text-align: center;
}
.ghost:hover { background: #3b82f6; color: #ffffff; }
</style></head>
<body>
<div class="btn">Comprar agora</div>
<div class="ghost">Saiba mais</div>
</body></html>

<!doctype html>
<html>
<head>
<style>
  body { margin: 0; font-size: 16px; }
  section { border: 1px solid #ccc; }
  .sticky1 { position: sticky; top: 0; background: seagreen; color: white; padding: 8px; }
  .sticky2 { position: sticky; top: 0; background: darkorange; color: white; padding: 8px; }
  p { margin: 18px 12px; }
</style>
</head>
<body>
  <section>
    <div class="sticky1">SEÇÃO A — header sticky top:0</div>
    <p>A-1</p><p>A-2</p><p>A-3</p><p>A-4</p><p>A-5</p><p>A-6</p><p>A-7</p><p>A-8</p>
  </section>
  <section>
    <div class="sticky2">SEÇÃO B — header sticky top:0</div>
    <p>B-1</p><p>B-2</p><p>B-3</p><p>B-4</p><p>B-5</p><p>B-6</p><p>B-7</p><p>B-8</p>
  </section>
</body>
</html>

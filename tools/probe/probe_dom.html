    out.push("FAIL\t" + cat + "\t" + name + "\t" + m); return;

  if (r === true) out.push("OK\t" + cat + "\t" + name);

}

T("removeEventListener", function(){ var n=0; function h(){n++} host.addEventListener('r', h); host.removeEventListener('r', h); host.dispatchEvent(new Event('r')); return n === 0; });
T("EventTarget construivel/subclasse", function(){ var t = new EventTarget(); var n=0; t.addEventListener('a', function(){n++}); t.dispatchEvent(new Event('a')); return n===1; });

// ⚠️ estes dois checavam `typeof ... === 'boolean'` e `typeof addEventListener ===

C("canvas/midia");
// ⚠️ EXERCITA o contexto (o `g ? true` de antes daria OK para qualquer objeto

T("canvas.toDataURL", function(){ return typeof d.getElementById('c').toDataURL === 'function'; });
T("OffscreenCanvas", function(){ return typeof OffscreenCanvas === 'function'; });
T("WebGL", function(){ var g = null; try { g = d.getElementById('c').getContext('webgl'); } catch(e){} return g ? true : 'null'; });
T("new Image()", function(){ return typeof Image === 'function' && new Image() instanceof HTMLElement; });
T("img.onload/decode", function(){ return typeof (new Image()).decode === 'function'; });

T("URL + searchParams", function(){ var u = new URL('https://a.b/c?x=1'); return u.searchParams.get('x') === '1'; });

T("localStorage/sessionStorage", function(){ localStorage.setItem('k','1'); return localStorage.getItem('k') === '1' && typeof sessionStorage === 'object'; });
T("document.cookie", function(){ return typeof d.cookie === 'string'; });
T("MessageChannel/postMessage", function(){ return typeof MessageChannel === 'function' && typeof window.postMessage === 'function'; });
T("BroadcastChannel", function(){ return typeof BroadcastChannel === 'function'; });
T("ReadableStream", function(){ return typeof ReadableStream === 'function'; });
T("crypto.getRandomValues", function(){ var a = new Uint8Array(4); crypto.getRandomValues(a); return a.length === 4; });
T("crypto.randomUUID", function(){ return typeof crypto.randomUUID === 'function' && crypto.randomUUID().length === 36; });

// ── preparação do MutationObserver ───────────────────────────────────────────
// A entrega é ASSÍNCRONA por spec (fim do microtask checkpoint): registrar,
// mutar e conferir na MESMA tarefa dá zero até no Chrome — a versão anterior
// desta sonda fazia exatamente isso e media a coisa errada. Então mutamos AQUI,
// no script de carga, e conferimos no setTimeout lá embaixo: uma tarefa depois.
var moN = 0, moRec = null, moSuportado = (typeof MutationObserver === 'function');
if (moSuportado) {
  var moAlvo = d.createElement('div');
  host.appendChild(moAlvo);
  var moObs = new MutationObserver(function (recs) { moN += recs.length; moRec = recs[0]; });
  moObs.observe(moAlvo, { childList: true });
  moAlvo.appendChild(d.createElement('b'));
}

// ── preparação do IntersectionObserver ───────────────────────────────────────
// ⚠️ esta sonda dizia OK para "IntersectionObserver dispara" testando
// `typeof IntersectionObserver === 'function'` — o EXATO erro que o cabeçalho
// deste arquivo manda evitar, e que deu OK durante meses para um stub cujo
// callback nunca rodava. Agora a API é EXERCITADA: dois alvos, um dentro e um
// fora da tela, conferidos numa tarefa POSTERIOR (a entrega vem do passo de
// interseção do hospedeiro, que roda DEPOIS dos timers do frame — no Chrome é
// igual: um setTimeout(0) registrado junto roda ANTES do 1º callback).
var ioN = 0, ioEnt = null, ioLongeN = 0, ioLongeVis = null;
var ioSuportado = (typeof IntersectionObserver === 'function');
if (ioSuportado) {
  new IntersectionObserver(function (es) { ioN += es.length; ioEnt = es[es.length - 1]; }).observe(host);
  var ioLonge = d.createElement('div');
  ioLonge.setAttribute('style', 'position:absolute;top:5000px;left:0;width:50px;height:50px');
  d.body.appendChild(ioLonge);
  new IntersectionObserver(function (es) { ioLongeN += es.length; ioLongeVis = es[0].isIntersecting; }).observe(ioLonge);
}

// ── preparação do ResizeObserver ────────────────────────────────────────────
// Mesma entrega diferida do IntersectionObserver (passo do hospedeiro, depois
// dos timers), então também é conferido lá no 2º salto.
var roN = 0, roEnt = null, roSuportado = (typeof ResizeObserver === 'function');
if (roSuportado) {
  var roAlvo = d.createElement('div');
  roAlvo.setAttribute('style', 'width:222px;height:44px');
  d.body.appendChild(roAlvo);
  new ResizeObserver(function (es) { roN += es.length; roEnt = es[es.length - 1]; }).observe(roAlvo);
}

// Tudo acima roda SÍNCRONO, durante o parse — o mesmo momento em que o script de
// carga de um site roda. Emite já, para que a sonda ainda dê resultado se a
// página rodar com 1 frame só (o bloco diferido abaixo não chega a disparar).
console.log("=== PROBE_DOM_BEGIN ===");
for (var i = 0; i < out.length; i++) console.log(out[i]);
var emitidos = out.length;

// ── pos-layout ───────────────────────────────────────────────────────────────
// Metade do DOM só faz sentido DEPOIS do primeiro layout: medir geometria e
// estilo resolvido no meio do parse mede o momento errado. Este bloco repete as
// perguntas que dependem de layout num setTimeout — ou seja, no mesmo ponto em
// que roda o código interativo de um site (timer, rAF, handler de evento).
// ⚠️ exige frames>=2 no --render; o probe.ps1 já invoca assim.
setTimeout(function () {
  C("pos-layout");
  T("getComputedStyle display", function () { var v = getComputedStyle(host).display; return v === 'block' ? true : 'got=' + v; });
  T("getComputedStyle color", function () { var v = getComputedStyle(host).color; return /^rgb/.test(v) ? true : 'got=' + v; });
  T("getComputedStyle width", function () { var v = getComputedStyle(d.getElementById('f')).width; return /^\d+(\.\d+)?px$/.test(v) ? true : 'got=' + v; });
  T("getComputedStyle camelCase", function () { var v = getComputedStyle(host).fontSize; return /px$/.test(v) ? true : 'got=' + v; });
  T("getComputedStyle getPropertyValue", function () { var v = getComputedStyle(host).getPropertyValue('display'); return v === 'block' ? true : 'got=' + v; });
  T("getBoundingClientRect", function () { var r = host.getBoundingClientRect(); return r.width > 0 ? true : 'w=' + r.width; });
  T("offsetWidth", function () { return host.offsetWidth > 0 ? true : 'got=' + host.offsetWidth; });
  T("clientWidth/offsetTop", function () { return (host.clientWidth > 0 && typeof host.offsetTop === 'number') ? true : 'cw=' + host.clientWidth + ' ot=' + host.offsetTop; });
  T("rect derivados (right/bottom)", function () { var r = host.getBoundingClientRect(); return (r.right === r.x + r.width && r.bottom === r.y + r.height) ? true : 'right=' + r.right + ' bottom=' + r.bottom; });
  T("documentElement.clientHeight = viewport", function () { var v = d.documentElement.clientHeight; return v > 0 ? true : 'got=' + v; });
  T("body.scrollHeight (documento)", function () { var v = d.body.scrollHeight; return v > 0 ? true : 'got=' + v; });
  T("window.scrollY é número", function () { return typeof window.scrollY === 'number' ? true : 'got=' + typeof window.scrollY; });
  // A mutação foi feita no script de carga (ver "preparação" acima); aqui já é
  // outra tarefa, então o callback tem de ter rodado.
  T("MutationObserver dispara", function () {
    if (!moSuportado) return 'sem MutationObserver';
    return moN > 0 ? true : 'records=' + moN;
  });
  T("MutationObserver record util", function () {
    if (!moRec) return 'sem record';
    return (moRec.type === 'childList' && moRec.addedNodes.length === 1 &&
            moRec.addedNodes[0].tagName === 'B' && moRec.target === moAlvo)
      ? true : 'type=' + moRec.type + ' added=' + moRec.addedNodes.length;
  });
  // takeRecords É síncrono por spec: dá para conferir dentro da mesma tarefa.
  T("MutationObserver takeRecords", function () {
    if (!moSuportado) return 'sem MutationObserver';
    var alvo = d.createElement('div'); host.appendChild(alvo);
    var mo = new MutationObserver(function () {});
    mo.observe(alvo, { childList: true });
    alvo.appendChild(d.createElement('i'));
    var q = mo.takeRecords(); mo.disconnect();
    return (q.length === 1 && q[0].addedNodes[0].tagName === 'I') ? true : 'q=' + q.length;
  });
  T("MutationObserver attributeFilter+oldValue", function () {
    if (!moSuportado) return 'sem MutationObserver';
    var alvo = d.createElement('div'); alvo.className = 'antes'; host.appendChild(alvo);
    var mo = new MutationObserver(function () {});
    mo.observe(alvo, { attributeFilter: ['class'], attributeOldValue: true });
    alvo.setAttribute('data-z', '1');   // fora do filtro: não deve gerar record
    alvo.className = 'depois';
    var q = mo.takeRecords(); mo.disconnect();
    return (q.length === 1 && q[0].attributeName === 'class' && q[0].oldValue === 'antes')
      ? true : 'q=' + q.length + ' n=' + (q[0] && q[0].attributeName) + ' old=' + (q[0] && q[0].oldValue);
  });
  // ── uma tarefa DEPOIS ──────────────────────────────────────────────────────
  // O passo de interseção do hospedeiro roda depois dos timers do frame, então
  // nada do IntersectionObserver chegou até aqui. Este segundo salto (~2 frames)
  // é onde ele já entregou — e é também de onde TODAS as linhas diferidas são
  // impressas, para o placar sair completo. ⚠️ exige frames>=3 no --render.
  setTimeout(function () {
    C("pos-layout");
    T("IntersectionObserver dispara", function () {
      if (!ioSuportado) return 'sem IntersectionObserver';
      if (ioN < 1) return 'entries=' + ioN + ' (callback nunca rodou)';
      return (ioEnt.isIntersecting === true && ioEnt.target === host && ioEnt.intersectionRatio > 0)
        ? true : 'vis=' + ioEnt.isIntersecting + ' ratio=' + ioEnt.intersectionRatio;
    });
    T("ResizeObserver dispara com o tamanho", function () {
      if (!roSuportado) return 'sem ResizeObserver';
      if (roN < 1) return 'entries=' + roN + ' (callback nunca rodou)';
      var w = roEnt.contentRect.width, bs = roEnt.borderBoxSize && roEnt.borderBoxSize[0];
      return (w === 222 && bs && bs.inlineSize === 222) ? true : 'w=' + w + ' border=' + (bs && bs.inlineSize);
    });
    T("IntersectionObserver observacao inicial fora da tela", function () {
      // O alvo a 5000px NAO intersecta -- mas a spec manda entregar assim mesmo
      // uma 1a entry com isIntersecting=false. E dela que todo lazy-load depende.
      if (!ioSuportado) return 'sem IntersectionObserver';
      return (ioLongeN === 1 && ioLongeVis === false) ? true : 'n=' + ioLongeN + ' vis=' + ioLongeVis;
    });

    for (var i = emitidos; i < out.length; i++) console.log(out[i]);
    var ok=0, bad=0, fail=0;
    for (var i = 0; i < out.length; i++) { if (out[i].indexOf('OK\t')===0) ok++; else if (out[i].indexOf('BAD\t')===0) bad++; else fail++; }
    console.log("=== PROBE_DOM_END total=" + out.length + " ok=" + ok + " bad=" + bad + " fail=" + fail + " ===");
  }, 32);
}, 0);
</script>
